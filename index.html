<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIS | Next-Gen AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --bg: #05070a;
            --glass: rgba(17, 25, 40, 0.75);
        }
        body { 
            background-color: var(--bg); 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: radial-gradient(circle at top right, rgba(0, 242, 255, 0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(0, 102, 255, 0.05), transparent);
        }
        .glass-panel { 
            background: var(--glass); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* The Moving Logo */
        @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .logo-ring { animation: rotate-slow 10s linear infinite; }
        
        /* Chat Bubbles */
        .bubble-ai { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .bubble-user { background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(0, 102, 255, 0.1)); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 24px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 glass-panel border-r border-white/5 flex flex-col p-6 hidden lg:flex">
        <div class="flex items-center gap-3 mb-12">
            <div class="relative w-10 h-10">
                <svg viewBox="0 0 100 100" class="logo-ring absolute inset-0">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad)" stroke-width="2" stroke-dasharray="20 10"/>
                    <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#00f2ff"/><stop offset="100%" style="stop-color:#0066ff"/></linearGradient></defs>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-cyan-400 font-bold text-xl">A</span>
                </div>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tighter uppercase">Aetheris</h1>
        </div>
        
        <button class="w-full py-3 px-4 rounded-2xl bg-white/5 border border-white/10 text-sm font-semibold hover:bg-white/10 transition-all flex items-center gap-2 mb-8" onclick="location.reload()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            New Evolution
        </button>
        
        <div class="flex-grow overflow-y-auto space-y-4">
            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Recent Cycles</p>
            <div class="text-sm text-gray-400 p-3 hover:bg-white/5 rounded-xl cursor-pointer transition-all">Quantum Computing Analysis</div>
            <div class="text-sm text-gray-400 p-3 hover:bg-white/5 rounded-xl cursor-pointer transition-all">Cyberpunk Art Render</div>
        </div>
    </aside>

    <main class="flex-grow flex flex-col items-center relative">
        
        <div class="w-full p-6 flex justify-between items-center lg:hidden">
            <h1 class="text-xl font-bold text-cyan-400">AETHERIS</h1>
            <button class="p-2 glass-panel rounded-lg">☰</button>
        </div>

        <div id="chat-container" class="flex-grow w-full max-w-4xl overflow-y-auto p-6 md:p-12 space-y-8">
            <div id="welcome" class="h-full flex flex-col items-center justify-center text-center space-y-6">
                <div class="w-24 h-24 rounded-full bg-cyan-500/10 flex items-center justify-center border border-cyan-500/20 shadow-[0_0_50px_rgba(0,242,255,0.1)]">
                    <div class="w-4 h-4 bg-cyan-400 rounded-full animate-ping"></div>
                </div>
                <h2 class="text-5xl font-extrabold tracking-tight">How can I assist <br><span class="text-cyan-400">your evolution?</span></h2>
                <div class="flex gap-3 text-sm">
                    <span class="px-4 py-2 glass-panel rounded-full text-gray-400 border-white/5">DeepSearch 4.0</span>
                    <span class="px-4 py-2 glass-panel rounded-full text-gray-400 border-white/5">Logic Trace Active</span>
                </div>
            </div>
        </div>

        <div class="w-full max-w-4xl p-6">
            <div class="glass-panel rounded-[32px] p-2 flex items-center shadow-2xl">
                <input id="user-input" type="text" placeholder="Message Aetheris..." 
                       class="flex-grow bg-transparent px-6 py-4 outline-none text-lg placeholder:text-gray-600">
                
                <div class="flex items-center gap-2 pr-4">
                    <button onclick="startVoice()" class="p-3 text-gray-500 hover:text-cyan-400 transition-all">
                        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
                    </button>
                    <button onclick="sendMessage()" class="p-4 bg-cyan-500 hover:bg-cyan-400 text-black rounded-full transition-all shadow-lg shadow-cyan-500/20">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>
            <p class="text-[10px] text-center mt-4 text-gray-600 tracking-widest uppercase">Aetheris may display inaccurate information. Verify logic output.</p>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const welcome = document.getElementById('welcome');

        // IMPORTANT: Replace this URL with your Railway or Render URL later
        const BACKEND_URL = "http://localhost:8000/api/chat";

        async function sendMessage() {
            const query = userInput.value.trim();
            if(!query) return;

            if(welcome) welcome.style.display = 'none';
            
            // Add User Message
            addMessage(query, 'user');
            userInput.value = "";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: query, user_id: "user_1"})
                });
                
                if (!response.ok) throw new Error("Backend offline");

                const data = await response.json();
                addMessage(data.answer, 'ai', data.image_url);
                
                const speech = new SpeechSynthesisUtterance(data.answer);
                window.speechSynthesis.speak(speech);

            } catch (err) {
                addMessage("I am currently in 'Offline Mode'. To enable my brain, you must host the backend script on a server.", 'ai');
            }
        }

        function addMessage(text, sender, img = null) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-4 duration-500`;
            
            div.innerHTML = `
                <div class="max-w-[80%] p-6 ${sender === 'user' ? 'bubble-user' : 'bubble-ai'}">
                    <p class="text-sm leading-relaxed">${text}</p>
                    ${img ? `<img src="${img}" class="mt-4 rounded-xl border border-cyan-500/30">` : ''}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function startVoice() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; sendMessage(); };
            rec.start();
        }

        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
