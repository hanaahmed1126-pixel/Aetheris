<!DOCTYPE html>
<html>
<head>
    <title>AETHERIS | AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(0, 242, 255, 0.1); }
        .orb { 
            width: 100px; height: 100px; border-radius: 50%; 
            background: radial-gradient(circle, #0ef 0%, #0066ff 100%);
            box-shadow: 0 0 40px #0ef; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div class="w-64 glass p-6 hidden md:block">
        <div class="flex items-center gap-2 mb-10">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#0ef"><path d="M12 2L2 22h20L12 2z"/></svg>
            <h1 class="text-xl font-bold tracking-tighter">AETHERIS</h1>
        </div>
        <button class="w-full border border-cyan-900 p-2 rounded-lg text-sm text-cyan-400 hover:bg-cyan-950">New Evolution</button>
    </div>

    <!-- Main Chat -->
    <div class="flex-grow flex flex-col items-center p-6">
        <div class="flex-grow w-full max-w-3xl overflow-y-auto p-4 space-y-6" id="chat-box">
            <div class="orb mx-auto mt-20"></div>
            <h2 class="text-center text-3xl font-bold mt-6">How shall we evolve today?</h2>
        </div>

        <!-- Input Area -->
        <div class="w-full max-w-3xl glass p-2 rounded-full flex items-center mb-4">
            <input id="user-input" type="text" placeholder="Initiate inquiry..." class="flex-grow bg-transparent p-4 outline-none">
            <button onclick="startVoice()" class="p-3 text-cyan-400">🎤</button>
            <button onclick="send()" class="bg-cyan-500 text-black px-6 py-3 rounded-full font-bold">SEND</button>
        </div>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('user-input');
            const box = document.getElementById('chat-box');
            if(!input.value) return;

            box.innerHTML += `<div class="text-right text-gray-400">${input.value}</div>`;
            const query = input.value;
            input.value = "";

            const res = await fetch('YOUR_BACKEND_URL/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query, user_id: "1"})
            });
            const data = await res.json();
            
            box.innerHTML += `<div class="bg-white/5 p-4 rounded-xl border border-white/10">${data.answer}</div>`;
            if(data.image_url) box.innerHTML += `<img src="${data.image_url}" class="rounded-xl w-64 border border-cyan-500">`;
            
            // Speak back
            const speech = new SpeechSynthesisUtterance(data.answer);
            window.speechSynthesis.speak(speech);
        }

        function startVoice() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = (e) => { document.getElementById('user-input').value = e.results[0][0].transcript; send(); };
            rec.start();
        }
    </script>
</body>
</html>
