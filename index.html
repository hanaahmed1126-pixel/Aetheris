<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AETHERIS VIRTUOSO | VR Music Sandbox</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
    
    <style>
      .instruction-overlay {
        position: fixed; top: 10px; left: 10px; z-index: 999;
        color: #0ef; font-family: sans-serif; background: rgba(0,0,0,0.7);
        padding: 15px; border-radius: 10px; border: 1px solid #0ef;
      }
    </style>
  </head>
  <body>

    <div class="instruction-overlay">
      <h2>AETHERIS VIRTUOSO</h2>
      <p>1. Click screen to enable audio.</p>
      <p>2. In VR: Use triggers to hit the pads.</p>
      <p>3. Desktop: Click the cubes.</p>
    </div>

    <a-scene shadow="type: pcfsoft">
      
      <a-entity environment="preset: trunk; groundColor: #050505; grid: dots; gridColor: #0ef; dressing: arches; dressingColor: #004466; skyType: gradient; skyColor: #020617"></a-entity>

      <a-entity id="music-engine"></a-entity>

      <a-entity position="0 1.2 -1" rotation="-20 0 0">
        <a-box class="clickable instrument" position="-0.4 0 0" width="0.3" height="0.1" depth="0.3" color="#0066ff" 
               animation__hover="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
               animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"
               data-note="C2" data-type="drum"></a-box>
        <a-box class="clickable instrument" position="0 0 0" width="0.3" height="0.1" depth="0.3" color="#00f2ff"
               data-note="E2" data-type="drum"></a-box>
        <a-box class="clickable instrument" position="0.4 0 0" width="0.3" height="0.1" depth="0.3" color="#7000ff"
               data-note="G2" data-type="drum"></a-box>
        <a-text value="DRUM PADS" position="-0.2 0.2 0" scale="0.5 0.5 0.5" color="#0ef"></a-text>
      </a-entity>

      <a-entity position="0 1.2 -2">
        <a-cylinder class="clickable instrument" position="-0.6 0.5 0" radius="0.05" height="1.5" color="#ff00ea" data-note="C4" data-type="synth"></a-cylinder>
        <a-cylinder class="clickable instrument" position="-0.3 0.5 0" radius="0.05" height="1.5" color="#00f2ff" data-note="D4" data-type="synth"></a-cylinder>
        <a-cylinder class="clickable instrument" position="0 0.5 0" radius="0.05" height="1.5" color="#ff00ea" data-note="E4" data-type="synth"></a-cylinder>
        <a-cylinder class="clickable instrument" position="0.3 0.5 0" radius="0.05" height="1.5" color="#00f2ff" data-note="F4" data-type="synth"></a-cylinder>
        <a-cylinder class="clickable instrument" position="0.6 0.5 0" radius="0.05" height="1.5" color="#ff00ea" data-note="G4" data-type="synth"></a-cylinder>
        <a-text value="LASER HARP" position="-0.2 1.4 0" scale="0.5 0.5 0.5" color="#ff00ea"></a-text>
      </a-entity>

      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-cursor color="#0ef" fuse="false" raycaster="objects: .clickable"></a-cursor>
      </a-entity>

      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 2"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 2"></a-entity>

    </a-scene>

    <script>
      // 1. Setup Audio Synths
      const drumSynth = new Tone.MembraneSynth().toDestination();
      const polySynth = new Tone.PolySynth(Tone.Synth).toDestination();
      
      // Add effects
      const reverb = new Tone.Reverb(3).toDestination();
      polySynth.connect(reverb);

      let audioStarted = false;

      // Start Audio Context on first click
      document.body.addEventListener('mousedown', async () => {
        if (!audioStarted) {
            await Tone.start();
            console.log("Aetheris Audio Engaged");
            audioStarted = true;
        }
      });

      // 2. Interaction Logic
      const instruments = document.querySelectorAll('.instrument');

      instruments.forEach(inst => {
        inst.addEventListener('mousedown', function () {
          const note = this.getAttribute('data-note');
          const type = this.getAttribute('data-type');

          // Play Sound
          if (type === 'drum') {
            drumSynth.triggerAttackRelease(note, "8n");
          } else {
            polySynth.triggerAttackRelease(note, "4n");
          }

          // Visual Feedback (Flash)
          const originalColor = this.getAttribute('color');
          this.setAttribute('color', '#ffffff');
          setTimeout(() => {
            this.setAttribute('color', originalColor);
          }, 100);
          
          // Haptic Feedback for VR Controllers
          const hands = document.querySelectorAll('[laser-controls]');
          hands.forEach(hand => {
            if(hand.components['haptics']) {
                hand.components['haptics'].pulse(0.5, 100);
            }
          });
        });
      });
    </script>
  </body>
</html>
